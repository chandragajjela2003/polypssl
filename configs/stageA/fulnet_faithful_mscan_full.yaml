# Stage A, checkpoint R2a: FULNet EXACTLY as released (including its code issues), 100% labels.
# Purpose: reproduce FULNet's published numbers (Table 1, SegNeXt row: ETIS 0.780, ColonDB 0.793, ...)
# and document the code audit. Settings = FULNet option.py defaults.
name: fulnet_faithful_mscan_full
model: {name: fulnet_c, encoder: mscan_t, ual: faithful, pretrained: true}
data: {img_size: 320, split: full}
fal: {mode: faithful, lam: 0.5, aug_weight: 0.1, prob: 0.5}
loss: {mode: faithful}
train: {iterations: 18125, batch_size: 8, lr: 5.0e-5, weight_decay: 1.0e-4, grad_clip: 2.0}
